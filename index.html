<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3d63">
<meta name="apple-mobile-web-app-title" content="SQLD 합격노트">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>SQLD 합격노트</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#18202b; --sub:#5d6b7c; --line:#e3e8ef;
  --pri:#1b5e9e; --pri-soft:#e6f0fa; --ok:#1f8a4c; --ok-soft:#e5f5ec; --bad:#c8402f; --bad-soft:#fbe9e6;
  --warn:#b7791f; --warn-soft:#fdf3e1; --code:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1116; --card:#171b22; --ink:#e8edf3; --sub:#97a3b3; --line:#262c36;
    --pri:#5aa2e6; --pri-soft:#16283b; --ok:#4cc184; --ok-soft:#14291e; --bad:#ef7b6b; --bad-soft:#2f1915;
    --warn:#e2ad55; --warn-soft:#2c2214; --code:#1f252e; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.3px}
h2{font-size:18px;margin:20px 0 8px;letter-spacing:-.2px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:22px;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;text-align:center}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--code);font-size:13px;margin:3px 4px 3px 0;border:1px solid transparent}
.chip.on{background:var(--pri);color:#fff}
.chip.c{background:var(--pri-soft);color:var(--pri)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--code);color:var(--sub);margin-right:4px}
.d1{background:var(--ok-soft);color:var(--ok)} .d2{background:var(--warn-soft);color:var(--warn)} .d3{background:var(--bad-soft);color:var(--bad)} .d4{background:var(--pri-soft);color:var(--pri)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--pri);font-weight:600}
.tabbar svg{width:23px;height:23px}
.q{font-size:17px;line-height:1.55;font-weight:600;margin:6px 0 10px;word-break:keep-all}
pre.code{background:var(--code);border-radius:10px;padding:10px 12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:0 0 12px;white-space:pre}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);margin:8px 0;line-height:1.45;word-break:keep-all}
.opt .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--code);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opt.sel{border-color:var(--pri)} .opt.sel .n{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .n{background:var(--bad);color:#fff}
.exp{border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.55;font-size:15px}
.exp.ok{background:var(--ok-soft)} .exp.no{background:var(--bad-soft)}
.bar{height:8px;border-radius:5px;background:var(--code);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--warn)} .bar.high i{background:var(--ok)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}
.list .it:last-child{border-bottom:0}
.muted{color:var(--sub)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon-btn{padding:8px 10px;border-radius:10px;background:var(--code);font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
ul.sum{padding-left:18px;margin:6px 0;line-height:1.6}
ul.sum li{margin:3px 0}
code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em;font-family:ui-monospace,Menlo,monospace}
.trap{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.5}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;font-size:20px;line-height:1.5;word-break:keep-all}
.flash small{display:block;font-size:14px;color:var(--sub);margin-top:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
table.t{border-collapse:collapse;font:12px/1.4 ui-monospace,Menlo,monospace;width:100%}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;white-space:nowrap}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:.94}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.seg{display:flex;background:var(--code);border-radius:10px;padding:3px;gap:3px;margin:6px 0}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-1px}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600}
/* 표기법 그림 */
.figs{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:4px 0 12px;background:var(--code);border-radius:10px;padding:12px}
svg.fig{max-width:100%;height:auto;display:block}
svg.fig.sm{width:180px;max-width:100%}
@media (min-width: 700px){ .figs svg.fig{width:420px} svg.fig.sm{width:210px} }
.rounds{display:flex;flex-wrap:wrap;gap:2px}
.rounds .chip{font-size:13px}
.navrow{display:grid;grid-template-columns:1fr 2.2fr;gap:10px;margin-top:12px}
/* 문제 위 테이블 */
.qt{position:relative;background:var(--code);border-radius:10px;padding:8px 8px 6px;margin:6px 0 10px;overflow-x:auto}
.qt-t + .qt-t{margin-top:8px}
.qt-t b{font-size:12px;color:var(--sub);letter-spacing:.3px}
table.qt-tb{font-size:10px;width:auto;min-width:100%;letter-spacing:-.2px}
table.qt-tb th,table.qt-tb td{padding:2px 3px;border-bottom:1px solid var(--line)}
table.qt-tb tr:last-child td{border-bottom:0}
.tfold{position:absolute;right:8px;top:6px;font-size:12px;color:var(--sub);padding:2px 6px;z-index:2}
.qt-in{margin:0 0 10px} .qt-in + .qt-in{margin-top:-2px}
.tfold-open{font-size:13px;color:var(--pri);padding:6px 0;margin:2px 0 4px}
/* 필기 */
.inkw{position:relative}
.inkw .ink{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.inkw.inking .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.inkw.inking{-webkit-user-select:none;user-select:none;outline:2px dashed var(--pri-soft);outline-offset:4px;border-radius:6px}
.inkw.inking .tfold{visibility:hidden}
.inkbtn{font-size:12.5px;padding:5px 9px;border-radius:8px;background:var(--code);color:var(--ink);white-space:nowrap}
.inkbtn.on{background:var(--pri);color:#fff}
.inkbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.inkbar .dot{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.inkbar .dot.on{box-shadow:0 0 0 2px var(--c)}
@media (min-width: 700px){ .qt{padding:8px 10px 6px} table.qt-tb{font-size:13px;letter-spacing:0} table.qt-tb th,table.qt-tb td{padding:3px 8px} .inkbtn{font-size:13.5px;padding:6px 11px} .inkbar .dot{width:26px;height:26px} }
/* ───── 태블릿 (아이패드) ───── */
@media (min-width: 700px){
  html,body{font-size:17px}
  .wrap{max-width:900px;padding:20px 32px 36px}
  h1{font-size:28px} h2{font-size:20px;margin-top:26px}
  .card{padding:16px 20px}
  .sub{font-size:15px} .tag{font-size:12px} .stat span{font-size:13.5px} .stat b{font-size:25px}
  .list .it > span:last-child{white-space:nowrap}
  .q{font-size:19px}
  pre.code{font-size:14.5px;padding:14px 16px}
  .opt{padding:14px 16px;font-size:16.5px}
  .opt .n{flex-basis:24px;height:24px}
  .exp{font-size:16px;padding:14px 18px}
  .btn{padding:14px 16px}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin:10px 0}
  .cgrid > .card{margin:0}
  .ugrid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start}
  .tabbar{padding-left:max(0px,calc(50% - 320px));padding-right:max(0px,calc(50% - 320px))}
  .tabbar button{font-size:12px;padding:10px 0 9px}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{max-width:720px;border-radius:18px;max-height:82vh;padding:20px 24px 24px}
  .sheet .grab{display:none}
  .flash{min-height:360px;font-size:26px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  table.t{font-size:13.5px}
}
/* 가로로 넓을 때: 홈 2단, 문제는 왼쪽 지문 / 오른쪽 보기 */
@media (min-width: 1000px){
  .wrap{max-width:1180px}
  .hgrid{display:grid;grid-template-columns:1.05fr 1fr;grid-template-areas:"hl hr" "hd hr";column-gap:24px;align-items:start}
  .hl{grid-area:hl} .hr{grid-area:hr} .hd{grid-area:hd}
  .hgrid .hr > h2:first-child{margin-top:10px}
  .qa{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:6px}
  .qa-l{position:sticky;top:calc(12px + env(safe-area-inset-top))}
  .qa-r > .opt:first-child{margin-top:0}
}
.opt .ot{flex:1;min-width:0}.opt .why{display:none;margin-top:5px;font-size:13px;line-height:1.4;color:var(--sub);font-weight:400}.opt.open .why{display:block}.opt.wrong .why{color:var(--bad);font-weight:600}.opt.hasw{cursor:pointer}.why-hint{font-size:12.5px;color:var(--sub);text-align:center;margin:2px 0 10px}

.qbox{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:2px 0 12px;font-size:14.5px;line-height:1.6;background:var(--card);word-break:keep-all}
.qbox-h{display:inline-block;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:1px 9px;border-radius:4px;margin-bottom:6px}
.qbox .bl{white-space:pre-wrap}
.kimg{margin:2px 0 12px}.kimg img{max-width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.kimg figcaption{font-size:12px;line-height:1.45;color:var(--sub);margin-top:5px;word-break:keep-all}
.qnote{font-size:12.5px;color:var(--sub);margin:-4px 0 10px}
pre.ocode{margin:0;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.otb{overflow-x:auto;max-width:100%}
.kcode pre.code{white-space:pre-wrap;word-break:break-word}.otb table.t{width:auto;min-width:0}
@media (min-width: 700px){ .qbox{font-size:15.5px} pre.ocode{font-size:14px} }

.inkall .inkbar,.inkall .inkbtn{position:relative;z-index:4}
.inkall.inking{outline-offset:6px}
.inkall.inking .qa *{pointer-events:none}
.inkall.inking .qa .inkbar,.inkall.inking .qa .inkbar *,.inkall.inking .qa .inkbtn{pointer-events:auto}
.inkall .ink{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (min-width: 700px){ .inkall.inking .qa-l,.inkall.hasink .qa-l{position:static} }

.rvnote{font-size:13px;color:var(--sub);background:var(--code);border-radius:8px;padding:7px 10px;margin:-2px 0 10px}
.rvcard{border:1.5px solid var(--pri-soft)}
.mrc .rounds{display:flex;flex-wrap:wrap;gap:6px}.mrc .chip{margin:0}
.mrtip{font-size:14.5px;line-height:1.55;border-left:4px solid var(--pri)}

.more{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:15px;line-height:1.65;word-break:keep-all}
.more-h{font-size:12px;font-weight:700;color:var(--pri);letter-spacing:.02em}
.more h3{font-size:16px;margin:16px 0 6px}
.more p{margin:6px 0 10px}
.more ul{padding-left:18px;margin:6px 0 10px}.more li{margin:3px 0}
.more .otb{margin:6px 0 12px}
.more pre.code{margin:6px 0 8px;white-space:pre-wrap;word-break:break-word}
table.mt{font-size:13.5px;line-height:1.5;font-family:inherit;width:100%}
table.mt th,table.mt td{white-space:normal;vertical-align:top;padding:6px 8px 6px 0;word-break:keep-all}
table.mt th{font-size:12.5px;color:var(--sub);font-weight:600}
table.mt td:first-child{font-weight:600;min-width:4.5em}
.mout{margin:0 0 12px}.mout>span{display:block;font-size:12px;color:var(--sub);margin:2px 0 4px}
table.mo{width:auto;min-width:0}
@media (min-width: 700px){ .more{font-size:16px} table.mt{font-size:14.5px} }

.kbox{background:var(--pri-soft);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;line-height:1.55}
.kbox b,.tipbox b{font-size:12.5px;color:var(--pri);letter-spacing:.02em}
.kbox ul{margin:4px 0 0;padding-left:18px}.kbox li{margin:2px 0}
.tipbox{background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;line-height:1.55}
.tipbox b{color:var(--warn,#b7791f);margin-right:4px}
.inkall.inking .cink *{pointer-events:none}
@media (min-width: 700px){ .kbox,.tipbox{font-size:15.5px} }
.qref{color:var(--pri);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600}

pre.code{white-space:pre-wrap;word-break:break-word}
.opt.hasw:not(.wrong) .why{color:var(--sub)}
.opt.right .why.okw{display:block;color:var(--ok);font-weight:700}
.whytog{background:none;border:0;color:var(--pri);font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer}
.navrow.stick{position:sticky;bottom:0;z-index:6;margin:12px -4px 0;padding:12px 4px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.setrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;line-height:1.4;flex-wrap:wrap}.setrow input{width:20px;height:20px;margin:0;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<script src="data/concepts.js"></script>
<script src="data/concepts_more.js"></script>
<script src="data/bank.js"></script>
<script src="data/bank_kc.js"></script>
<script src="data/flash.js"></script>
<script src="data/plus.js"></script>
<script src="app.js"></script>
<script>
// 오프라인에서도 열리게 서비스워커 등록, 기록이 지워지지 않게 저장소 유지 요청
// 새 버전이 올라오면 앱을 다시 열 때 자동으로 확인하고, 바뀌면 한 번 새로고침
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); });
  }).catch(() => {}));
  let had = !!navigator.serviceWorker.controller, done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } had = true; });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
